name: Release

# Push a tag such as v1.4.0: the plugin zip and its update.json manifest are
# built and attached to a GitHub release. Sites running the plugin see the
# update within twelve hours and install it on their own (auto-updates).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version: *//p' cinq-wp-theme-updates.php)"
          constant="$(sed -n "s/^define( 'CINQ_WP_THEME_UPDATES_VERSION', '\(.*\)' );/\1/p" cinq-wp-theme-updates.php)"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ]; then
            echo "Tag $tag, header $header, constant $constant: bump both in cinq-wp-theme-updates.php." >&2
            exit 1
          fi

      - run: composer install --no-interaction --no-progress && composer lint

      - name: Build the zip
        run: |
          mkdir -p build
          git archive --format=tar --prefix=cinq-wp-theme-updates/ HEAD | tar -x -C build
          (cd build && zip -qr ../cinq-wp-theme-updates.zip cinq-wp-theme-updates)
          unzip -l cinq-wp-theme-updates.zip | tail -n 5

      # Read by the plugin's updater: a plain download, not rate-limited like
      # GitHub's API.
      - name: Write the update manifest
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg package "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/cinq-wp-theme-updates.zip" \
            --arg requires "$(sed -n 's/^ \* Requires at least: *//p' cinq-wp-theme-updates.php)" \
            --arg requires_php "$(sed -n 's/^ \* Requires PHP: *//p' cinq-wp-theme-updates.php)" \
            '{version: $version, url: $url, package: $package, requires: $requires, requires_php: $requires_php}' > update.json
          cat update.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cinq-wp-theme-updates.zip
            update.json
          generate_release_notes: true
